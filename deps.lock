# VioraEDA dependency lockfile
#
# Pins every external engine/toolchain tag and the sha256 of every prebuilt
# binary asset. Fresh builds MUST use exactly these versions/artifacts; a
# changed asset (or a tag that loses its binaries) is a release-blocker.
#
# Format of the [prebuilt] section (whitespace separated):
#   <name> <tag> <platform> <asset> <sha256> <url>
# Platforms: linux | windows | macos
#
# The [git] section lists FetchContent / source-build refs for reference and
# CI verification (git tags are content-addressed, so no hash is needed).

