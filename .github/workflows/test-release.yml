name: Test Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v0.1.0-beta)
        required: true
        type: string
  release:
    types: [published]

jobs:
  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            -p "*-windows-*" \
            -O "${{ runner.temp }}/release.zip" \
            --clobber

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            zip

      - name: Extract
        shell: msys2 {0}
        run: |
          ZIP=$(cygpath "${{ runner.temp }}")/release.zip
          mkdir -p /tmp/testdir
          bsdtar -xf "$ZIP" -C /tmp/testdir
          echo "--- contents ---"
          find /tmp/testdir -type f | head -50

      - name: Test 1 — DLL dependency check (recursive)
        shell: msys2 {0}
        run: |
          set -e
          shopt -s nocasematch
          FAIL=0
          CHECKED=""
          check_deps() {
            local f="$1"
            local indent="$2"
            # Avoid infinite loop (circular deps)
            local base=$(basename "$f")
            case " $CHECKED " in *" $base "*) return 0;; esac
            CHECKED="$CHECKED $base"
            deps=$(objdump -p "$f" 2>/dev/null | grep "DLL Name" | awk '{print $3}')
            for dll in $deps; do
              case "$dll" in
                kernel32.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|comdlg32.dll|imm32.dll|winmm.dll|ws2_32.dll|msvcrt.dll|version.dll|shlwapi.dll|comctl32.dll|uxtheme.dll|winspool.drv|msimg32.dll|usp10.dll|dnsapi.dll|iphlpapi.dll|opengl32.dll|glu32.dll|setupapi.dll|cfgmgr32.dll|ntmarta.dll|wldap32.dll|crypt32.dll|wtsapi32.dll|secur32.dll|wintrust.dll|oleacc.dll|riched20.dll|lz32.dll|mpr.dll|netapi32.dll|powrprof.dll|propsys.dll|dwmapi.dll|bcrypt.dll|ntdll.dll|sechost.dll|api-ms-win-*|d3d*.dll|DWrite.dll|dxgi.dll|AUTHZ.dll|AVRT.dll|USERENV.dll|WINHTTP.dll|RPCRT4.dll)
                  continue ;;
                python3*.dll|libpython3*.dll)
                  if [ -f "/tmp/testdir/bin/$dll" ]; then
                    [ "$indent" = "" ] && echo "${indent}OK $dll"
                    check_deps "/tmp/testdir/bin/$dll" "  $indent"
                  else
                    echo "${indent}NOTE $dll not bundled"
                  fi
                  continue ;;
                zlib1.dll|libzstd.dll)
                  if [ -f "/tmp/testdir/bin/$dll" ]; then
                    [ "$indent" = "" ] && echo "${indent}OK $dll"
                    check_deps "/tmp/testdir/bin/$dll" "  $indent"
                  else
                    echo "${indent}NOTE $dll not bundled"
                  fi
                  continue ;;
              esac
              if [ -f "/tmp/testdir/bin/$dll" ]; then
                [ "$indent" = "" ] && echo "${indent}OK $dll"
                check_deps "/tmp/testdir/bin/$dll" "  $indent"
              else
                echo "${indent}MISSING $dll"
                FAIL=$((FAIL+1))
              fi
            done
          }
          for exe in VioraEDA.exe viora.exe flux_runner.exe; do
            echo "=== Checking deps for $exe ==="
            CHECKED=""
            check_deps "/tmp/testdir/bin/$exe" ""
          done
          # Also check Qt plugins in subdirectories
          while IFS= read -r plugin; do
            echo "=== Checking deps for $(basename $plugin) ==="
            CHECKED=""
            check_deps "$plugin" ""
          done < <(find /tmp/testdir/bin -type f -name '*.dll' ! -path '/tmp/testdir/bin/*.dll' 2>/dev/null)
          echo "Missing DLLs: $FAIL"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
          echo "All DLL deps satisfied"

      - name: Test 2 — Launch test
        shell: msys2 {0}
        run: |
          set +e
          for exe in viora.exe flux_runner.exe; do
            echo "=== Launching $exe ==="
            "/tmp/testdir/bin/$exe" --help 2>&1 &
            PID=$!
            (sleep 5; kill $PID 2>/dev/null) &
            wait $PID 2>/dev/null
            RC=$?
            echo "  done $exe exit=$RC"
          done
          echo "=== Launching VioraEDA.exe ==="
          "/tmp/testdir/bin/VioraEDA.exe" --help 2>&1
          RC=$?
          echo "  done VioraEDA.exe exit=$RC"

      - name: Test 3 — CLI sanity
        shell: msys2 {0}
        run: |
          set +e
          echo "=== viora --version (3s timeout) ==="
          timeout 3 "/tmp/testdir/bin/viora.exe" --version 2>&1 || echo "(timeout or non-zero)"
          echo "=== viora --help (3s timeout, first 20 lines) ==="
          timeout 3 "/tmp/testdir/bin/viora.exe" --help 2>&1 | head -20 || echo "(timeout or non-zero)"

      - name: Test 4 — QApplication path
        shell: msys2 {0}
        run: |
          set +e
          echo "=== viora help (exercises QApplication) ==="
          QT_DEBUG_PLUGINS=1 "/tmp/testdir/bin/viora.exe" help 2>&1
          echo "help exit code: $?"

      - name: Test 5 — Simulation run
        shell: msys2 {0}
        run: |
          set +e
          echo "=== Writing test netlist ==="
          cat > /tmp/testdir/test.cir << 'EOF'
          * Test netlist
          V1 1 0 DC 5
          R1 1 0 1k
          .op
          .end
          EOF
          echo "=== Running viora netlist-run ==="
          WINPATH=$(cygpath -w /tmp/testdir/test.cir)
          "/tmp/testdir/bin/viora.exe" netlist-run "$WINPATH" --analysis op 2>&1
          RC=$?
          echo "netlist-run exit code: $RC"
          if [ "$RC" -ne 0 ]; then echo "FAIL: expected exit 0, got $RC"; exit 1; fi

      - name: Print summary
        shell: msys2 {0}
        run: |
          echo "=== Package summary ==="
          du -sh /tmp/testdir
          du -sh /tmp/testdir/bin/*
          echo ""
          echo "All tests completed"

  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p /tmp/macos-test
          gh release download "$TAG" --repo "${{ github.repository }}" \
            -p "*-macos-*.tar.gz" -O /tmp/macos-test/pkg.tar.gz --clobber
          tar -tzf /tmp/macos-test/pkg.tar.gz | head -30

      - name: Test 1 — bundle layout check
        run: |
          set -e
          mkdir -p /tmp/macos-test/extract
          tar -xzf /tmp/macos-test/pkg.tar.gz -C /tmp/macos-test/extract
          APP=$(find /tmp/macos-test/extract -name "VioraEDA.app" -maxdepth 3 | head -n 1)
          test -n "$APP" || (echo "MISSING: VioraEDA.app" && exit 1)
          echo "APP=$APP"
          test -f "$APP/Contents/MacOS/VioraEDA"
          test -f "$APP/Contents/MacOS/viora"
          test -f "$APP/Contents/MacOS/flux_runner"
          test -f "$APP/Contents/Resources/cm/analog.cm"
          test -f "$APP/Contents/Resources/cm/digital.cm"
          test -f "$APP/Contents/Info.plist"
          echo "All required bundle files present"

      - name: Test 2 — otool portability check
        run: |
          set -e
          APP=$(find /tmp/macos-test/extract -name "VioraEDA.app" -maxdepth 3 | head -n 1)
          echo "=== otool -L viora ==="
          otool -L "$APP/Contents/MacOS/viora" | head -40
          if otool -L "$APP"/Contents/MacOS/* | grep -E "/Users/runner/work|/home/runner/work"; then
            echo "FAIL: absolute runner paths remain"
            exit 1
          fi
          echo "No absolute runner paths"

      - name: Test 3 — CLI smoke (viora --version/--help)
        env:
          DYLD_LIBRARY_PATH: /tmp/macos-test/extract/VioraEDA.app/Contents/Frameworks
          HOME: /tmp/macos-smoke
        run: |
          mkdir -p "$HOME"
          APP=$(find /tmp/macos-test/extract -name "VioraEDA.app" -maxdepth 3 | head -n 1)
          "$APP/Contents/MacOS/viora" --version
          "$APP/Contents/MacOS/viora" --help | head -20

      - name: Test 4 — GUI launch (offscreen, SIGTERM-tolerant)
        env:
          HOME: /tmp/macos-smoke2
        run: |
          set +e
          APP=$(find /tmp/macos-test/extract -name "VioraEDA.app" -maxdepth 3 | head -n 1)
          QT_QPA_PLATFORM=offscreen "$APP/Contents/MacOS/VioraEDA" &
          pid=$!
          sleep 8
          kill $pid 2>/dev/null
          wait $pid
          rc=$?
          set -e
          if [ $rc -eq 0 ] || [ $rc -ge 128 ]; then
            echo "PASS: VioraEDA started without crashing (exit $rc)"
          else
            echo "FAIL: VioraEDA crashed (exit $rc)"
            exit $rc
          fi
