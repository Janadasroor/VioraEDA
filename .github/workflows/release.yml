name: Release VioraEDA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir_suffix: gcc_64
          - os: macos-15
            qt_host: mac
            qt_arch: clang_64
            qt_dir_suffix: macos
          - os: windows-2022
            qt_host: windows
            qt_arch: win64_mingw
            qt_dir_suffix: mingw64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt (Linux)
        if: runner.os == 'Linux'
        id: cache-qt-linux
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: ${{ runner.os }}-qt-6.10.0-linux_gcc_64

      - name: Install Qt (Linux)
        if: runner.os == 'Linux' && steps.cache-qt-linux.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" ${{ matrix.qt_host }} desktop 6.10.0 ${{ matrix.qt_arch }} -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools

      - name: Set Qt6_DIR (Linux)
        if: runner.os == 'Linux'
        run: echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/${{ matrix.qt_dir_suffix }}/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake curl ccache libedit zstd llvm libomp qt@6 eigen autoconf automake libtool bison flex pkg-config || true
          QT_PREFIX="$(brew --prefix qt@6 2>/dev/null || brew --prefix qt)"
          echo "Qt6_DIR=$QT_PREFIX/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Setup MSYS2 + Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-eigen3
            flex
            bison
            autoconf
            automake
            libtool
            gettext
            gettext-devel
            zip
            mingw-w64-x86_64-nsis

      - name: Set Qt6_DIR (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "Qt6_DIR=/mingw64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y software-properties-common ccache
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            autoconf automake libtool bison flex \
            libnghttp2-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0 libxkbcommon0 \
            libglib2.0-0 libfontconfig1 libfreetype6 \
            libnss3 libnspr4 libdbus-1-3 libxcb1 \
            libgssapi3-heimdal \
            llvm-21-dev \
            python3 python3-dev \
            libeigen3-dev \
            ngspice \
            file zsync dpkg-dev
          # Prebuilt ngspice deps (compiled on older Ubuntu): libssl1.1, libldap-2.4
          for pkg in \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openldap/libldap-2.4-2_2.4.49+dfsg-2ubuntu1.10_amd64.deb; do
            wget -qO /tmp/pkg.deb "$pkg" && sudo dpkg -i /tmp/pkg.deb || true
          done
          sudo apt-get install -f -y
          wget -qO /tmp/libnghttp2-14.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/n/nghttp2/libnghttp2-14_1.64.0-1ubuntu1_amd64.deb
          sudo dpkg -i /tmp/libnghttp2-14.deb


      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake --preset release -DVIOSPICE_BUILD_VIOMATRIXC=ON -DVIOSPICE_BUILD_FLUXSCRIPT=ON

      - name: Fetch ViospiceLib for bundling (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ ! -d "$HOME/viora-libs" ]; then
            git clone --depth 1 https://github.com/Janadasroor/viora-libs.git "$HOME/viora-libs"
          fi
          echo "Library size: $(du -sh "$HOME/viora-libs" | cut -f1)"

      - name: Fetch ViospiceLib for bundling (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          if [ ! -d "$HOME/viora-libs" ]; then
            git clone --depth 1 https://github.com/Janadasroor/viora-libs.git "$HOME/viora-libs"
          fi
          echo "Library size: $(du -sh "$HOME/viora-libs" | cut -f1)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export WANT_AUTOCONF=2.71
          export WANT_AUTOMAKE=1.16
          PYPATH=$(cygpath -w /mingw64/bin/python.exe)
          EIGEN_PATH=$(cygpath -m /mingw64/include/eigen3)
          cmake --preset msys2-mingw64 \
            -DPython3_EXECUTABLE="$PYPATH" -DPython_EXECUTABLE="$PYPATH" \
            -DEIGEN3_INCLUDE_DIR="$EIGEN_PATH" \
            -DVIOSPICE_BUNDLED_LIB="$HOME/viora-libs"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset release --parallel $(nproc)

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh --no-test -j2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build --preset msys2-mingw64 --parallel $(nproc)

      - name: Smoke test VioraEDA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ldconfig
          ldd ./build/VioraEDA 2>&1 | grep "not found" || echo "All libraries found"
          echo "=== viora --version ==="
          ./build/viora --version
          echo "=== viora --help ==="
          ./build/viora --help

      - name: Smoke test VioraEDA (macOS)
        if: runner.os == 'macOS'
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib:/opt/homebrew/lib
          # viora ignores --version/--help and launches the full GUI; redirect HOME so
          # it writes app data (ViospiceLib) to a throwaway dir instead of the shared one.
          HOME: /tmp/viora-smoke
        run: |
          mkdir -p "$HOME"
          echo "=== viora --version ==="
          ./build/viora --version
          echo "=== viora --help ==="
          ./build/viora --help

      - name: Smoke test VioraEDA (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          # Copy local prebuilt engine DLL
          cp -v build/viomatrixc-prebuilt/bin/libngspice-0.dll build/ 2>&1 || true
          
          # Dynamically copy the actual libpython DLL and create any expected aliases
          py_dll=$(find /mingw64/bin -maxdepth 1 -name "libpython3.*.dll" | head -n 1)
          if [ -n "$py_dll" ]; then
            cp -v "$py_dll" build/ || true
            py_version=$(basename "$py_dll" | sed -E 's/libpython([0-9]+)\.([0-9]+)\.dll/\1\2/')
            cp -v "$py_dll" "build/python${py_version}.dll" 2>/dev/null || true
          fi
          cp -v /mingw64/bin/python3.dll build/ 2>/dev/null || true

          # Copy Qt Windows platform plugins (including minimal/offscreen for headless CTest)
          for pdir in /mingw64/share/qt6/plugins /mingw64/plugins /mingw64/lib/qt6/plugins; do
            if [ -d "$pdir/platforms" ]; then
              mkdir -p build/platforms
              cp -v "$pdir/platforms/"*.dll build/platforms/ 2>&1 || true
              break
            fi
          done

          # Auto-discover and bundle missing MinGW / local DLLs from transitive dependencies
          shopt -s nocasematch
          unset SCANNED
          declare -a QUEUE
          # Seed queue with all executables and DLLs currently in build/
          while IFS= read -r f; do QUEUE+=("$f"); done < <(find build -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dll' \) 2>/dev/null)
          while [ ${#QUEUE[@]} -gt 0 ]; do
             f="${QUEUE[0]}"
             QUEUE=("${QUEUE[@]:1}")
             base=$(basename "$f")
             case " ${SCANNED[*]} " in *" $base "*) continue ;; esac
             SCANNED+=("$base")
             for dll in $(objdump -p "$f" 2>/dev/null | grep "DLL Name" | awk '{print $3}'); do
               [ -f "build/$dll" ] && continue
               case "$dll" in
                 kernel32.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|comdlg32.dll|imm32.dll|winmm.dll|ws2_32.dll|msvcrt.dll|version.dll|shlwapi.dll|comctl32.dll|uxtheme.dll|winspool.drv|msimg32.dll|usp10.dll|dnsapi.dll|iphlpapi.dll|opengl32.dll|glu32.dll|setupapi.dll|cfgmgr32.dll|ntmarta.dll|wldap32.dll|crypt32.dll|wtsapi32.dll|secur32.dll|wintrust.dll|oleacc.dll|riched20.dll|lz32.dll|mpr.dll|netapi32.dll|powrprof.dll|propsys.dll|dwmapi.dll|bcrypt.dll|ntdll.dll|sechost.dll|api-ms-win-*|d3d*.dll|DWrite.dll|dxgi.dll|AUTHZ.dll|AVRT.dll|USERENV.dll|WINHTTP.dll|RPCRT4.dll)
                   continue ;;
               esac
               # First look recursively in build/ (for locally built DLLs like libFluxScript.dll)
               local_dll=$(find build -name "$dll" 2>/dev/null | head -n 1)
               if [ -n "$local_dll" ] && [ -f "$local_dll" ] && [ ! -f "build/$dll" ]; then
                 cp -v "$local_dll" build/ && echo "  copied local $dll"
                 QUEUE+=("build/$dll")
               elif [ -f "/mingw64/bin/$dll" ] && [ ! -f "build/$dll" ]; then
                 cp "/mingw64/bin/$dll" build/ && echo "  copied $dll (transitive dep)"
                 QUEUE+=("build/$dll")
               fi
             done
          done

          echo "=== DLL dependency check ==="
          which ldd 2>/dev/null && ldd build/viora.exe 2>&1 | grep -i "not found" || echo "(ldd not available or no unresolved)"
          echo "=== viora --version ==="
          QT_QPA_PLATFORM=minimal ./build/viora.exe --version
          echo "=== viora --help ==="
          QT_QPA_PLATFORM=minimal ./build/viora.exe --help

      - name: Smoke test VioraEDA (macOS)
        if: runner.os == 'macOS'
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib:/opt/homebrew/lib
          # Launching the full GUI only to SIGTERM it leaves prefs/caches/ViospiceLib
          # behind that make integration.project_manager_launch SIGBUS later. Isolate it.
          HOME: /tmp/viora-smoke2
        run: |
          set +e
          if [ -f "./build/VioraEDA.app/Contents/MacOS/VioraEDA" ]; then
            EXE="./build/VioraEDA.app/Contents/MacOS/VioraEDA"
          else
            EXE="./build/VioraEDA"
          fi
          QT_QPA_PLATFORM=offscreen "$EXE" &
          pid=$!
          sleep 8
          kill $pid 2>/dev/null
          wait $pid
          rc=$?
          set -e
          if [ $rc -eq 0 ] || [ $rc -ge 128 ]; then
            echo "PASS: VioraEDA started without crashing (exit code $rc)"
          else
            echo "FAIL: VioraEDA crashed (exit code $rc)"
            exit $rc
          fi

      - name: Smoke test VioraEDA (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          # Copy local prebuilt engine DLL
          cp -v build/viomatrixc-prebuilt/bin/libngspice-0.dll build/ 2>&1 || true
          
          # Dynamically copy the actual libpython DLL and create any expected aliases
          py_dll=$(find /mingw64/bin -maxdepth 1 -name "libpython3.*.dll" | head -n 1)
          if [ -n "$py_dll" ]; then
            cp -v "$py_dll" build/ || true
            py_version=$(basename "$py_dll" | sed -E 's/libpython([0-9]+)\.([0-9]+)\.dll/\1\2/')
            cp -v "$py_dll" "build/python${py_version}.dll" 2>/dev/null || true
          fi
          cp -v /mingw64/bin/python3.dll build/ 2>/dev/null || true

          # Copy Qt Windows platform plugins (including minimal/offscreen for headless CTest)
          for pdir in /mingw64/share/qt6/plugins /mingw64/plugins /mingw64/lib/qt6/plugins; do
            if [ -d "$pdir/platforms" ]; then
              mkdir -p build/platforms
              cp -v "$pdir/platforms/"*.dll build/platforms/ 2>&1 || true
              break
            fi
          done

          # Auto-discover and bundle missing MinGW / local DLLs from transitive dependencies
          shopt -s nocasematch
          unset SCANNED
          declare -a QUEUE
          # Seed queue with all executables and DLLs currently in build/
          while IFS= read -r f; do QUEUE+=("$f"); done < <(find build -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dll' \) 2>/dev/null)
          while [ ${#QUEUE[@]} -gt 0 ]; do
             f="${QUEUE[0]}"
             QUEUE=("${QUEUE[@]:1}")
             base=$(basename "$f")
             case " ${SCANNED[*]} " in *" $base "*) continue ;; esac
             SCANNED+=("$base")
             for dll in $(objdump -p "$f" 2>/dev/null | grep "DLL Name" | awk '{print $3}'); do
               [ -f "build/$dll" ] && continue
               case "$dll" in
                 kernel32.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|comdlg32.dll|imm32.dll|winmm.dll|ws2_32.dll|msvcrt.dll|version.dll|shlwapi.dll|comctl32.dll|uxtheme.dll|winspool.drv|msimg32.dll|usp10.dll|dnsapi.dll|iphlpapi.dll|opengl32.dll|glu32.dll|setupapi.dll|cfgmgr32.dll|ntmarta.dll|wldap32.dll|crypt32.dll|wtsapi32.dll|secur32.dll|wintrust.dll|oleacc.dll|riched20.dll|lz32.dll|mpr.dll|netapi32.dll|powrprof.dll|propsys.dll|dwmapi.dll|bcrypt.dll|ntdll.dll|sechost.dll|api-ms-win-*|d3d*.dll|DWrite.dll|dxgi.dll|AUTHZ.dll|AVRT.dll|USERENV.dll|WINHTTP.dll|RPCRT4.dll)
                   continue ;;
               esac
               # First look recursively in build/ (for locally built DLLs like libFluxScript.dll)
               local_dll=$(find build -name "$dll" 2>/dev/null | head -n 1)
               if [ -n "$local_dll" ] && [ -f "$local_dll" ] && [ ! -f "build/$dll" ]; then
                 cp -v "$local_dll" build/ && echo "  copied local $dll"
                 QUEUE+=("build/$dll")
               elif [ -f "/mingw64/bin/$dll" ] && [ ! -f "build/$dll" ]; then
                 cp "/mingw64/bin/$dll" build/ && echo "  copied MinGW $dll (transitive dep)"
                 QUEUE+=("build/$dll")
               fi
             done
          done

          echo "=== DLL dependency check ==="
          which ldd 2>/dev/null && ldd build/viora.exe 2>&1 | grep -i "not found" || echo "(ldd not available or no unresolved)"
          echo "=== file info ==="
          file build/viora.exe 2>&1 || true
          # Launch viora.exe (CLI) to smoke test DLL loading
          set +e
          echo "=== launching viora.exe (CLI) ==="
          QT_QPA_PLATFORM=minimal ./build/viora.exe --help 2>&1
          rc=$?
          set -e
          echo "=== exit code: $rc ==="
          if [ $rc -eq 0 ] || [ $rc -ge 128 ]; then
            echo "PASS: viora CLI started without DLL loading errors (exit code $rc)"
          else
            echo "FAIL: viora CLI crashed or failed to load (exit code $rc)"
            exit $rc
          fi

      - name: Run unit tests (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib
        run: |
          # The viora smoke tests above launch the GUI (which ignores --version/--help
          # and is SIGTERM'd), leaving a partially-written ViospiceLib that makes
          # integration.project_manager_launch SIGBUS (SIGBUS) on re-read. Start tests
          # from a clean app-data state.
          rm -rf "$HOME/ViospiceLib"
          # ldconfig does not exist on macOS; only refresh the cache where present.
          if command -v ldconfig >/dev/null 2>&1; then sudo ldconfig; fi
          ctest --preset unit -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$PWD/build:/mingw64/bin:$PATH"
          export QT_PLUGIN_PATH="$PWD/build"
          export QT_QPA_PLATFORM=offscreen
          ctest --preset unit -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          export QT_DIR="${{ runner.temp }}/Qt/6.10.0/gcc_64"
          export VERSION="${{ github.ref_name }}"
          bash scripts/package_linux.sh --lib "$HOME/viora-libs"
          ls -lh build/installer/

      - name: Verify package contents (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          ls -lh build/installer/
          test -f build/installer/VioraEDA-*-linux-x86_64.tar.gz
          test -f build/installer/VioraEDA-*-linux-x86_64.deb
          test -f build/installer/VioraEDA-*-linux-x86_64.AppImage || echo "Note: AppImage file check"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          export VERSION="${{ github.ref_name }}"
          bash scripts/package_macos.sh --lib "$HOME/viora-libs"
          ls -lh build/installer/

      - name: Verify package contents (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          ls -lh build/installer/
          test -f build/installer/VioraEDA-*-macos-*.dmg
          test -f build/installer/VioraEDA-*-macos-*.tar.gz
          test -f build/installer/VioraEDA-*-macos-*.pkg || echo "Note: .pkg missing (pkgbuild unavailable?)"
          # Fail closed on required bundle pieces (parity with Windows verify step)
          bash scripts/package_macos.sh --verify-only --lib "$HOME/viora-libs"
          echo "=== otool portability check (no absolute runner paths in dependencies) ==="
          ! otool -L build/stage_macos/VioraEDA.app/Contents/MacOS/* 2>/dev/null | grep -E '^[[:space:]]+.*(/Users/runner/work|/home/runner/work)' || (echo "ERROR: absolute runner paths in bundle" && exit 1)
          echo "All macOS package checks passed"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          mkdir -p staging/bin staging/cm staging/python staging/templates/flux
          # Copy smart block templates
          cp -r templates staging/
          cp -r python/templates staging/python/ 2>/dev/null || true
          cp -r python/templates/*.flux staging/templates/flux/ 2>/dev/null || true
          cp build/VioraEDA.exe staging/bin/
          cp build/viora.exe staging/bin/ 2>/dev/null || echo "no viora.exe"
          cp build/flux_runner.exe staging/bin/ 2>/dev/null || echo "no flux_runner.exe"
          find build -name "vioavr.exe" -exec cp {} staging/bin/ \; 2>/dev/null || echo "no vioavr.exe"
          cp build/VioraEDA_Setup.exe staging/bin/ 2>/dev/null || echo "no VioraEDA_Setup.exe"
          cp build/VioraEDA_Setup.exe "${{ github.workspace }}/VioraEDA-${{ github.ref_name }}-windows-x86_64-Setup.exe" 2>/dev/null || true
          # Code models (.cm) — from build/cm/ (CMake copies them) or direct from prebuilt
          cp -r build/cm/. staging/cm/ 2>/dev/null || true
          if [ -z "$(ls -A staging/cm 2>/dev/null)" ]; then
            # Fallback: prebuilt VioMATRIXC stores .cm in lib/ngspice/
            for f in build/viomatrixc-prebuilt/lib/ngspice/*.cm; do
              [ -f "$f" ] && cp "$f" staging/cm/ || echo "no cm files found"
            done
          fi
          # VioMATRIXC / ngspice engine DLL — put next to exe (Windows has no RPATH)
          cp build/viomatrixc-prebuilt/bin/*.dll staging/bin/ 2>/dev/null || echo "no vmc dlls"
          # LLVM DLLs (needed by flux_runner runtime)
          cp /mingw64/bin/LLVM-C*.dll staging/bin/ 2>/dev/null || echo "no LLVM-C*.dll"
          cp /mingw64/bin/libLLVM*.dll staging/bin/ 2>/dev/null || echo "no libLLVM*.dll"
          cp /mingw64/bin/LLVM*.dll staging/bin/ 2>/dev/null || echo "no LLVM*.dll"
          # MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll staging/bin/ 2>/dev/null || echo "no libgcc"
          cp /mingw64/bin/libstdc++-6.dll staging/bin/ 2>/dev/null || echo "no libstdc++"
          cp /mingw64/bin/libwinpthread-1.dll staging/bin/ 2>/dev/null || echo "no libwinpthread"
          cp /mingw64/bin/zlib1.dll staging/bin/ 2>/dev/null || echo "no zlib1"
          cp /mingw64/bin/libzstd.dll staging/bin/ 2>/dev/null || echo "no libzstd"

          # Dynamically copy the actual libpython DLL and create any expected aliases
          py_dll=$(find /mingw64/bin -maxdepth 1 -name "libpython3.*.dll" | head -n 1)
          if [ -n "$py_dll" ]; then
            cp -v "$py_dll" staging/bin/ || true
            py_version=$(basename "$py_dll" | sed -E 's/libpython([0-9]+)\.([0-9]+)\.dll/\1\2/')
            cp -v "$py_dll" "staging/bin/python${py_version}.dll" 2>/dev/null || true
          fi
          cp -v /mingw64/bin/python3.dll staging/bin/ 2>/dev/null || true

          # Bundle Python standard library into python<ver>.zip
          for py_lib in /mingw64/lib/python3.*; do
            if [ -d "$py_lib" ]; then
              py_ver_short=$(basename "$py_lib" | tr -d 'python.')
              zip_name="$GITHUB_WORKSPACE/staging/bin/python${py_ver_short}.zip"
              echo "Packaging Python standard library into $zip_name..."
              (cd "$py_lib" && /mingw64/bin/python3 -m zipfile -c "$zip_name" .) || true
              mkdir -p staging/lib
              cp -v "$zip_name" staging/lib/ || true
              printf "python%s.zip\n.\nimport site\n" "$py_ver_short" > "staging/bin/python${py_ver_short}._pth"
              break
            fi
          done

          # Bundle Qt DLLs
          windeployqt --dir staging/bin staging/bin/VioraEDA.exe
          
          # Copy all Qt platform plugins (including qoffscreen.dll and qminimal.dll for headless CLI)
          for pdir in /mingw64/share/qt6/plugins /mingw64/plugins /mingw64/lib/qt6/plugins; do
            if [ -d "$pdir/platforms" ]; then
              mkdir -p staging/bin/platforms
              cp -v "$pdir/platforms/"*.dll staging/bin/platforms/ 2>&1 || true
              break
            fi
          done
          
          # Auto-discover and bundle missing MinGW / local DLLs from transitive dependencies
          shopt -s nocasematch
          unset SCANNED
          declare -a QUEUE
          # Seed queue with all files currently in staging/bin
          while IFS= read -r f; do QUEUE+=("$f"); done < <(find staging/bin -type f \( -name '*.exe' -o -name '*.dll' \) 2>/dev/null)
          while [ ${#QUEUE[@]} -gt 0 ]; do
             f="${QUEUE[0]}"
             QUEUE=("${QUEUE[@]:1}")
             base=$(basename "$f")
             case " ${SCANNED[*]} " in *" $base "*) continue ;; esac
             SCANNED+=("$base")
             for dll in $(objdump -p "$f" 2>/dev/null | grep "DLL Name" | awk '{print $3}'); do
               [ -f "staging/bin/$dll" ] && continue
               case "$dll" in
                 kernel32.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|comdlg32.dll|imm32.dll|winmm.dll|ws2_32.dll|msvcrt.dll|version.dll|shlwapi.dll|comctl32.dll|uxtheme.dll|winspool.drv|msimg32.dll|usp10.dll|dnsapi.dll|iphlpapi.dll|opengl32.dll|glu32.dll|setupapi.dll|cfgmgr32.dll|ntmarta.dll|wldap32.dll|crypt32.dll|wtsapi32.dll|secur32.dll|wintrust.dll|oleacc.dll|riched20.dll|lz32.dll|mpr.dll|netapi32.dll|powrprof.dll|propsys.dll|dwmapi.dll|bcrypt.dll|ntdll.dll|sechost.dll|api-ms-win-*|d3d*.dll|DWrite.dll|dxgi.dll|AUTHZ.dll|AVRT.dll|USERENV.dll|WINHTTP.dll|RPCRT4.dll)
                   continue ;;
               esac
               # First look recursively in build/ (for locally built DLLs like libFluxScript.dll)
               local_dll=$(find build -name "$dll" 2>/dev/null | head -n 1)
               if [ -n "$local_dll" ] && [ -f "$local_dll" ] && [ ! -f "staging/bin/$dll" ]; then
                 cp -v "$local_dll" staging/bin/ && echo "  copied local $dll"
                 QUEUE+=("staging/bin/$dll")
               elif [ -f "/mingw64/bin/$dll" ] && [ ! -f "staging/bin/$dll" ]; then
                 cp "/mingw64/bin/$dll" staging/bin/ && echo "  copied $dll (transitive dep)"
                 QUEUE+=("staging/bin/$dll")
               fi
             done
          done
          cd staging
          zip -r ../VioraEDA-${{ github.ref_name }}-windows-x86_64.zip .
          cd ..

      - name: Package NSIS (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/mingw64/bin:$PATH"
          makensis -DOUTFILE="${{ github.workspace }}/VioraEDA-${{ github.ref_name }}-windows-x86_64-Setup.exe" -DVERSION="${{ github.ref_name }}" tools/installer/installer.nsi
          ls -lh "${{ github.workspace }}"/*.exe

      - name: Verify package contents (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          MISSING=0
          check_file() {
            if [ ! -f "staging/$1" ]; then
              echo "MISSING: $1"
              MISSING=1
            fi
          }
          check_file "bin/VioraEDA.exe"
          check_file "bin/viora.exe"
          check_file "bin/flux_runner.exe"
          check_file "bin/vioavr.exe"
          check_file "bin/libngspice-0.dll"
          check_file "bin/libgcc_s_seh-1.dll"
          check_file "bin/libstdc++-6.dll"
          check_file "bin/libwinpthread-1.dll"
          check_file "cm/analog.cm"
          check_file "cm/digital.cm"
          check_file "templates/circuits/metadata.json"
          echo "--- staging tree ---"
          find staging -type f | head -50
          if [ "$MISSING" -eq 1 ]; then
            echo "ERROR: required files missing from package"
            exit 1
          fi
          echo "All required files present"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/installer/VioraEDA-*-linux-x86_64.tar.gz
            build/installer/VioraEDA-*-linux-x86_64.AppImage
            build/installer/VioraEDA-*-linux-x86_64.deb
            build/installer/VioraEDA-*-macos-*.dmg
            build/installer/VioraEDA-*-macos-*.tar.gz
            build/installer/VioraEDA-*-macos-*.pkg
            VioraEDA-*-linux-x86_64.tar.gz
            VioraEDA-*-linux-x86_64.AppImage
            deb-pkg/*.deb
            VioraEDA-*-macos-*.tar.gz
            dmg-pkg/*.dmg
            VioraEDA-*-windows-x86_64.zip
            VioraEDA-*-windows-x86_64-Setup.exe
            VioraEDA-*-windows-x86_64.exe
