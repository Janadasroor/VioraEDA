name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned dependency URLs and refs
        run: |
          bash scripts/verify_deps.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt (Linux)
        if: runner.os == 'Linux'
        id: cache-qt-linux
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: ${{ runner.os }}-qt-6.10.0-linux_gcc_64

      - name: Install Qt (Linux)
        if: runner.os == 'Linux' && steps.cache-qt-linux.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" linux desktop 6.10.0 linux_gcc_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools

      - name: Set Qt6_DIR (Linux)
        if: runner.os == 'Linux'
        run: echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake curl ccache libedit zstd llvm libomp qt@6 eigen autoconf automake libtool bison flex pkg-config || true
          QT_PREFIX="$(brew --prefix qt@6 2>/dev/null || brew --prefix qt)"
          echo "Qt6_DIR=$QT_PREFIX/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y software-properties-common ccache
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            autoconf automake libtool bison flex \
            libnghttp2-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            llvm-21-dev \
            python3 python3-dev \
            libeigen3-dev \
            ngspice
          # Prebuilt ngspice deps (compiled on older Ubuntu): libssl1.1, libldap-2.4
          for pkg in \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openldap/libldap-2.4-2_2.4.49+dfsg-2ubuntu1.10_amd64.deb; do
            wget -qO /tmp/pkg.deb "$pkg" && sudo dpkg -i /tmp/pkg.deb || true
          done
          sudo apt-get install -f -y
          # GitHub runner image ships a libcurl that references the nghttp2 1.61 API
          # (nghttp2_option_set_no_rfc9113_leading_and_trailing_ws_validation), but noble's
          # libnghttp2-14 is only 1.59. Force-upgrade nghttp2 so tests link successfully.
          wget -qO /tmp/libnghttp2-14.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/n/nghttp2/libnghttp2-14_1.64.0-1ubuntu1_amd64.deb
          sudo dpkg -i /tmp/libnghttp2-14.deb
          apt-cache policy libnghttp2-14


      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      - name: Setup MSYS2 + Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-eigen3
            flex
            bison
            autoconf
            automake
            libtool
            gettext
            gettext-devel
            zip

      - name: Set Qt6_DIR (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "Qt6_DIR=/mingw64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake --preset release -DVIOSPICE_BUILD_VIOMATRIXC=ON -DVIOSPICE_BUILD_FLUXSCRIPT=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Pin the MSYS2 wrapper to the known-good combo (Ubuntu 24.04).
          export WANT_AUTOCONF=2.71
          export WANT_AUTOMAKE=1.16
          EIGEN_PATH="$(cygpath -m /mingw64/include/eigen3)"
          cmake --preset msys2-mingw64 -DEIGEN3_INCLUDE_DIR="$EIGEN_PATH"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset release --parallel $(nproc)

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh --no-test -j3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build --preset msys2-mingw64 --parallel $(nproc)

      - name: Smoke test VioraEDA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ldconfig
          ldd ./build/VioraEDA 2>&1 | grep "not found" || echo "All libraries found"
          echo "=== viora --version ==="
          ./build/viora --version
          echo "=== viora --help ==="
          ./build/viora --help

      - name: Smoke test VioraEDA (macOS)
        if: runner.os == 'macOS'
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib
        run: |
          echo "=== viora --version ==="
          ./build/viora --version
          echo "=== viora --help ==="
          ./build/viora --help

      - name: Smoke test VioraEDA (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          # Copy local prebuilt engine DLL
          cp -v build/viomatrixc-prebuilt/bin/libngspice-0.dll build/ 2>&1 || true
          
          # Dynamically copy the actual libpython DLL and create any expected aliases
          py_dll=$(find /mingw64/bin -maxdepth 1 -name "libpython3.*.dll" | head -n 1)
          if [ -n "$py_dll" ]; then
            cp -v "$py_dll" build/ || true
            py_version=$(basename "$py_dll" | sed -E 's/libpython([0-9]+)\.([0-9]+)\.dll/\1\2/')
            cp -v "$py_dll" "build/python${py_version}.dll" 2>/dev/null || true
          fi
          cp -v /mingw64/bin/python3.dll build/ 2>/dev/null || true

          # Copy Qt Windows platform plugins (including minimal/offscreen for headless CTest)
          for pdir in /mingw64/share/qt6/plugins /mingw64/plugins /mingw64/lib/qt6/plugins; do
            if [ -d "$pdir/platforms" ]; then
              mkdir -p build/platforms
              cp -v "$pdir/platforms/"*.dll build/platforms/ 2>&1 || true
              break
            fi
          done

          # Auto-discover and bundle missing MinGW / local DLLs from transitive dependencies
          shopt -s nocasematch
          unset SCANNED
          declare -a QUEUE
          # Seed queue with all executables and DLLs currently in build/
          while IFS= read -r f; do QUEUE+=("$f"); done < <(find build -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dll' \) 2>/dev/null)
          while [ ${#QUEUE[@]} -gt 0 ]; do
             f="${QUEUE[0]}"
             QUEUE=("${QUEUE[@]:1}")
             base=$(basename "$f")
             case " ${SCANNED[*]} " in *" $base "*) continue ;; esac
             SCANNED+=("$base")
             for dll in $(objdump -p "$f" 2>/dev/null | grep "DLL Name" | awk '{print $3}'); do
               [ -f "build/$dll" ] && continue
               case "$dll" in
                 kernel32.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|comdlg32.dll|imm32.dll|winmm.dll|ws2_32.dll|msvcrt.dll|version.dll|shlwapi.dll|comctl32.dll|uxtheme.dll|winspool.drv|msimg32.dll|usp10.dll|dnsapi.dll|iphlpapi.dll|opengl32.dll|glu32.dll|setupapi.dll|cfgmgr32.dll|ntmarta.dll|wldap32.dll|crypt32.dll|wtsapi32.dll|secur32.dll|wintrust.dll|oleacc.dll|riched20.dll|lz32.dll|mpr.dll|netapi32.dll|powrprof.dll|propsys.dll|dwmapi.dll|bcrypt.dll|ntdll.dll|sechost.dll|api-ms-win-*|d3d*.dll|DWrite.dll|dxgi.dll|AUTHZ.dll|AVRT.dll|USERENV.dll|WINHTTP.dll|RPCRT4.dll)
                   continue ;;
               esac
               # First look recursively in build/ (for locally built DLLs like libFluxScript.dll)
               local_dll=$(find build -name "$dll" 2>/dev/null | head -n 1)
               if [ -n "$local_dll" ] && [ -f "$local_dll" ] && [ ! -f "build/$dll" ]; then
                 cp -v "$local_dll" build/ && echo "  copied local $dll"
                 QUEUE+=("build/$dll")
               elif [ -f "/mingw64/bin/$dll" ] && [ ! -f "build/$dll" ]; then
                 cp "/mingw64/bin/$dll" build/ && echo "  copied MinGW $dll (transitive dep)"
                 QUEUE+=("build/$dll")
               fi
             done
          done

          echo "=== DLL dependency check ==="
          which ldd 2>/dev/null && ldd build/viora.exe 2>&1 | grep -i "not found" || echo "(ldd not available or no unresolved)"
          echo "=== viora --version ==="
          QT_QPA_PLATFORM=minimal ./build/viora.exe --version
          echo "=== viora --help ==="
          QT_QPA_PLATFORM=minimal ./build/viora.exe --help

      - name: Unit tests (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib
        run: bash scripts/ci_ctest.sh --output-on-failure --preset unit -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PWD/build:$PATH"
          echo "=== PATH ==="
          echo "$PATH"
          echo "=== ldd check on test exe ==="
          ldd build/test_sim_rf_math.exe 2>&1 | grep -i "not found" || echo "(no unresolved deps)"
          echo "=== launching ctest ==="
          export QT_QPA_PLATFORM=offscreen
          bash scripts/ci_ctest.sh --output-on-failure --preset msys2-mingw64 -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" linux desktop 6.10.0 linux_gcc_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y software-properties-common ccache
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            autoconf automake libtool bison flex \
            libnghttp2-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            llvm-21-dev \
            python3 python3-dev \
            libeigen3-dev \
            ngspice
          for pkg in \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openldap/libldap-2.4-2_2.4.49+dfsg-2ubuntu1.10_amd64.deb; do
            wget -qO /tmp/pkg.deb "$pkg" && sudo dpkg -i /tmp/pkg.deb || true
          done
          sudo apt-get install -f -y
          # GitHub runner image ships a libcurl that references the nghttp2 1.61 API
          # (nghttp2_option_set_no_rfc9113_leading_and_trailing_ws_validation), but noble's
          # libnghttp2-14 is only 1.59. Force-upgrade nghttp2 so tests link successfully.
          wget -qO /tmp/libnghttp2-14.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/n/nghttp2/libnghttp2-14_1.64.0-1ubuntu1_amd64.deb
          sudo dpkg -i /tmp/libnghttp2-14.deb
          apt-cache policy libnghttp2-14

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-asan

      - name: Configure with ASan
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan -j2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-asan/viomatrixc-prebuilt/lib:${{ github.workspace }}/build-asan/fluxscript-prebuilt/lib
        run: |
          sudo ldconfig
          bash scripts/ci_ctest.sh --preset asan -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          python3 -m venv /tmp/qt-env
          /tmp/qt-env/bin/pip install aqtinstall
          /tmp/qt-env/bin/aqt install-qt --outputdir "${{ runner.temp }}/Qt" linux desktop 6.10.0 linux_gcc_64 -m qtcharts qtpdf qtwebsockets qtmultimedia qt5compat qtshadertools
          echo "Qt6_DIR=${{ runner.temp }}/Qt/6.10.0/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y software-properties-common ccache
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y \
            build-essential cmake \
            autoconf automake libtool bison flex \
            clang-21 \
            libcurl4-openssl-dev \
            libnghttp2-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            llvm-21-dev \
            python3 python3-dev \
            libeigen3-dev \
            ngspice
          for pkg in \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openldap/libldap-2.4-2_2.4.49+dfsg-2ubuntu1.10_amd64.deb; do
            wget -qO /tmp/pkg.deb "$pkg" && sudo dpkg -i /tmp/pkg.deb || true
          done
          sudo apt-get install -f -y
          # GitHub runner image ships a libcurl that references the nghttp2 1.61 API
          # (nghttp2_option_set_no_rfc9113_leading_and_trailing_ws_validation), but noble's
          # libnghttp2-14 is only 1.59. Force-upgrade nghttp2 so tests link successfully.
          wget -qO /tmp/libnghttp2-14.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/n/nghttp2/libnghttp2-14_1.64.0-1ubuntu1_amd64.deb
          sudo dpkg -i /tmp/libnghttp2-14.deb
          apt-cache policy libnghttp2-14

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-coverage

      - name: Configure with coverage
        run: |
          cmake --preset release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

      - name: Build
        run: cmake --build --preset release --parallel $(nproc)

      - name: Test
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
          LLVM_PROFILE_FILE: "coverage-%p.profraw"
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/viomatrixc-prebuilt/lib:${{ github.workspace }}/build/fluxscript-prebuilt/lib
        run: |
          sudo ldconfig
          bash scripts/ci_ctest.sh --preset unit -R "^(schematic|core|simulator|rpi|unit_|regression|integration)\."

      - name: Generate coverage report
        if: always()
        run: |
          llvm-profdata-21 merge -sparse coverage-*.profraw -o coverage.profdata || true
          llvm-cov-21 report --instr-profile=coverage.profdata build/VioraEDA --ignore-filename-regex='.*_deps/.*|.*bindings/.*' || true
          llvm-cov-21 show --instr-profile=coverage.profdata build/VioraEDA --ignore-filename-regex='.*_deps/.*|.*bindings/.*' > coverage.txt 2>&1 || true
          echo "Coverage report generated"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
